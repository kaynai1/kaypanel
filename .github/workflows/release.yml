name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: kaypanel-linux-amd64
          - goos: linux
            goarch: arm64
            name: kaypanel-linux-arm64
          - goos: windows
            goarch: amd64
            name: kaypanel-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Tidy and test
        run: |
          go mod tidy
          go vet ./...
          go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.name }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image tar
        run: |
          docker build -t kaypanel:${GITHUB_REF_NAME} .
          docker tag kaypanel:${GITHUB_REF_NAME} kaypanel:latest
          docker save kaypanel:${GITHUB_REF_NAME} kaypanel:latest | gzip -9 > kaypanel-image-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kaypanel-image-amd64.tar.gz
          path: kaypanel-image-amd64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
